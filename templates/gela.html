<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ gela_izena }} · Euskara Ageria</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Nunito,sans-serif}</style>
</head>
<body class="min-h-screen bg-zinc-100 p-3 sm:p-5">
<main class="mx-auto max-w-5xl">
  <header class="sticky top-0 z-30 -mx-3 mb-5 flex items-center gap-3 border-b border-zinc-200 bg-zinc-100/95 px-3 py-4 backdrop-blur sm:-mx-5 sm:px-5">
    <a href="{{ url_for('irakasle_index') }}" class="rounded-full bg-white px-4 py-2 font-black shadow-sm">← Gelak</a>
    <div>
      <h1 class="text-2xl font-black text-zinc-900">{{ gela_izena }}</h1>
      <p class="text-sm font-bold text-zinc-500">+1 / −1 zuzenean · +? / −? nahi den kopurua</p>
    </div>
  </header>

  {% for klasea, ikasleak in taldeak %}
    <section class="mb-7">
      <h2 class="mb-3 text-sm font-black uppercase tracking-[.18em] text-zinc-500">{{ klasea }}</h2>
      <div class="grid gap-3 sm:grid-cols-2">
        {% for s in ikasleak %}
        <article class="rounded-3xl bg-white p-3 shadow-sm">
          <div class="flex items-center gap-3">
            <a href="{{ url_for('mostrar_alumno', clase=s.clase, nombre=s.nombre) }}" target="_blank" class="shrink-0">
              <img src="{{ url_for('static', filename='photos/' ~ s.clase ~ '/' ~ s.foto) }}" class="h-16 w-16 rounded-2xl object-cover" alt="">
            </a>
            <div class="min-w-0 flex-1">
              <a href="{{ url_for('mostrar_alumno', clase=s.clase, nombre=s.nombre) }}" target="_blank" class="block truncate text-lg font-black text-zinc-900 hover:underline">{{ s.display }}</a>
              <div class="mt-1 flex items-center gap-2">
                <span class="rounded-full bg-zinc-950 px-3 py-1 text-sm font-black text-white">{{ s.puntuak }} puntu</span>
                <a href="{{ url_for('irakasle_ikaslea', clase=s.clase, nombre=s.nombre) }}" class="text-xs font-black text-zinc-400 hover:text-zinc-900">Historikoa</a>
              </div>
            </div>
          </div>

          <form method="post" action="{{ url_for('irakasle_aldatu_puntuak', clase=s.clase, nombre=s.nombre) }}" class="mt-3 grid grid-cols-4 gap-2">
            <input type="hidden" name="next" value="{{ request.path }}">
            <button name="delta" value="-1" class="rounded-2xl bg-rose-100 py-2 font-black text-rose-700">−1</button>
            <button type="button" onclick="customDelta(this.form,-1)" class="rounded-2xl bg-rose-50 py-2 font-black text-rose-500">−?</button>
            <button name="delta" value="1" class="rounded-2xl bg-emerald-100 py-2 font-black text-emerald-700">+1</button>
            <button type="button" onclick="customDelta(this.form,1)" class="rounded-2xl bg-emerald-50 py-2 font-black text-emerald-600">+?</button>
          </form>

          <form method="post" action="{{ url_for('irakasle_absentzia', clase=s.clase, nombre=s.nombre) }}" class="mt-2">
            <input type="hidden" name="next" value="{{ request.path }}">
            <button class="w-full rounded-2xl border-2 py-2 text-sm font-black {{ 'border-amber-500 bg-amber-100 text-amber-800' if s.absentzia else 'border-zinc-200 bg-zinc-50 text-zinc-500' }}">
              {% if s.absentzia %}✓ Absentzia aste honetan{% else %}Absentzia aste honetan{% endif %}
            </button>
          </form>
        </article>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</main>
<script>
function customDelta(form, sign){
  const raw = prompt(sign > 0 ? 'Zenbat puntu gehitu?' : 'Zenbat puntu kendu?');
  if(raw === null) return;
  const n = parseInt(raw, 10);
  if(!Number.isInteger(n) || n <= 0) return;
  const hidden = document.createElement('input');
  hidden.type = 'hidden'; hidden.name = 'delta'; hidden.value = String(sign*n);
  form.appendChild(hidden); form.submit();
}
</script>
</body>
</html>
