<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8" />
<title>{{ alumno[0] }} · Euskal Ageria</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --medal-size: clamp(46px, 11vw, 64px);
    --ribbon-w: clamp(12px, 3vw, 18px);
    --ribbon-h: clamp(18px, 5vw, 28px);
  }
  body{font-family:'Nunito',sans-serif}
  .nombre{font-family:'Luckiest Guy',cursive;line-height:.95;text-shadow:2px 2px 0 #fff,4px 4px 0 #0002}

  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes fadeInUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes revealHeart{
    0%{clip-path:path('M50 78 C20 58 2 40 2 20 C2 9 10 2 20 2 C31 2 40 11 50 21 C60 11 69 2 80 2 C90 2 98 9 98 20 C98 40 80 58 50 78 Z');transform:translate(-50%,-50%) scale(.1);opacity:1}
    65%{clip-path:path('M50 78 C20 58 2 40 2 20 C2 9 10 2 20 2 C31 2 40 11 50 21 C60 11 69 2 80 2 C90 2 98 9 98 20 C98 40 80 58 50 78 Z');transform:translate(-50%,-50%) scale(1.2);opacity:1}
    100%{clip-path:path('M50 78 C20 58 2 40 2 20 C2 9 10 2 20 2 C31 2 40 11 50 21 C60 11 69 2 80 2 C90 2 98 9 98 20 C98 40 80 58 50 78 Z');transform:translate(-50%,-50%) scale(24);opacity:0}
  }
  @keyframes introFade{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}

  .app-card{animation:fadeInUp .55s ease .45s both}
  .intro-overlay{position:fixed;inset:0;z-index:50;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,255,255,.9));animation:introFade 1.35s ease forwards;pointer-events:none}
  .intro-heart{position:absolute;left:50%;top:50%;width:110px;height:110px;transform:translate(-50%,-50%);animation:revealHeart 1.15s cubic-bezier(.2,.8,.2,1) forwards;background:linear-gradient(135deg,#f97316,#fb7185)}
  .intro-heart::before{content:'❤';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.12)}

  .medal-grid{display:grid;grid-template-columns:repeat(5, minmax(0,1fr));gap:.45rem;align-items:start}
  .medal-item{display:flex;flex-direction:column;align-items:center;gap:.5rem;min-width:0}
  .medal-wrap{width:calc(var(--medal-size) + 8px);height:calc(var(--medal-size) + var(--ribbon-h) - 6px);display:flex;align-items:flex-start;justify-content:center}
  .medal{position:relative;width:var(--medal-size);height:var(--medal-size);border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:900;border:4px solid rgba(255,255,255,.7);box-shadow:0 5px 0 rgba(0,0,0,.15);transition:.25s;font-size:clamp(.95rem,3.2vw,1.15rem);flex:0 0 auto}
  .medal:before,.medal:after{content:"";position:absolute;top:calc(var(--medal-size) - 12px);width:var(--ribbon-w);height:var(--ribbon-h);background:inherit;z-index:-1;border-radius:0 0 6px 6px}
  .medal:before{left:calc(var(--medal-size) * .18);transform:rotate(12deg)}
  .medal:after{right:calc(var(--medal-size) * .18);transform:rotate(-12deg)}
  .locked{background:#27272a;color:#71717a;filter:grayscale(1);box-shadow:0 5px 0 #09090b}
  .m1{background:linear-gradient(135deg,#f59e0b,#fde68a);color:#7c2d12}
  .m2{background:linear-gradient(135deg,#14b8a6,#99f6e4);color:#134e4a}
  .m3{background:linear-gradient(135deg,#8b5cf6,#ddd6fe);color:#4c1d95}
  .m4{background:linear-gradient(135deg,#ef4444,#fecaca);color:#7f1d1d}
  .m5{background:linear-gradient(135deg,#0ea5e9,#bae6fd);color:#0c4a6e}

  @media (max-width:390px){
    .medal-grid{gap:.3rem}
    .medal-label{font-size:10px}
  }
</style>
</head>
<body class="min-h-screen {{ bg_cls }} flex items-center justify-center p-3 sm:p-4">
  <div class="intro-overlay" aria-hidden="true"><div class="intro-heart"></div></div>

  <main class="app-card relative w-full max-w-md rounded-[2rem] bg-white shadow-2xl">
    <img src="{{ url_for('static', filename='euskaraz.jpeg') }}" class="absolute inset-0 m-auto h-[70%] opacity-[.045] pointer-events-none" alt="">

    <section class="relative z-10 px-4 sm:px-6 pt-8 sm:pt-9 pb-6 sm:pb-7 text-center">
      <div class="text-[11px] sm:text-sm font-black uppercase tracking-[.22em] text-zinc-400">Euskal Ageria</div>
      <h1 class="nombre {{ txt_cls }} mt-3 text-[2.45rem] sm:text-6xl">{{ alumno[0] }}</h1>

      <div class="mt-6 sm:mt-7 flex justify-center">
        <div class="relative">
          <div class="absolute inset-2 rounded-full {{ bg_cls }} scale-110"></div>
          <img src="{{ url_for('static', filename='photos/' ~ alumno[2] ~ '/' ~ alumno[1]) }}"
               alt="{{ alumno[0] }}"
               class="relative h-40 w-40 sm:h-48 sm:w-48 rounded-full border-8 border-white object-cover shadow-xl"
               style="animation:floaty 4s ease-in-out infinite">
        </div>
      </div>

      <div class="mt-5 inline-flex items-end gap-2 rounded-3xl bg-zinc-950 px-6 sm:px-7 py-3 sm:py-4 text-white shadow-lg">
        <span class="text-4xl sm:text-5xl font-black leading-none">{{ alumno[3] }}</span>
        <span class="pb-1 text-base sm:text-lg font-extrabold tracking-wide">PUNTU</span>
      </div>

      <div class="mt-7 sm:mt-8 rounded-3xl bg-zinc-50 p-4 sm:p-5">
        <div class="mb-4 sm:mb-5 flex items-center justify-between gap-3">
          <div class="text-left min-w-0">
            <div class="text-[11px] sm:text-xs font-black uppercase tracking-[.18em] text-zinc-400">Urteko medailak</div>
            <div class="mt-1 text-xs sm:text-sm font-bold text-zinc-600">Desblokeatu epez epe</div>
          </div>
          <div class="shrink-0 rounded-full bg-white px-3 py-1 text-[11px] sm:text-xs font-black text-zinc-500 shadow-sm">{{ epea }}. EPEA</div>
        </div>

        <div class="medal-grid px-1 sm:px-2">
          {% for i in range(1,6) %}
          <div class="medal-item">
            <div class="medal-wrap">
              <div class="medal {% if i in medailak %}m{{ i }}{% else %}locked{% endif %}">
                {% if i in medailak %}{{ i }}{% else %}●{% endif %}
              </div>
            </div>
            <span class="medal-label text-[10px] sm:text-[11px] font-black text-zinc-500 text-center">{{ i }}. epea</span>
          </div>
          {% endfor %}
        </div>
      </div>
    </section>
  </main>
</body>
</html>
