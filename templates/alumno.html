<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8" />
<title>{{ alumno[0] }} · Euskal Ageria</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:'Nunito',sans-serif}
  .nombre{font-family:'Luckiest Guy',cursive;line-height:.95;text-shadow:2px 2px 0 #fff,4px 4px 0 #0002}
  @keyframes pop{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .medal{position:relative;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:4px solid rgba(255,255,255,.7);box-shadow:0 5px 0 rgba(0,0,0,.15);transition:.25s}
  .medal:before,.medal:after{content:"";position:absolute;top:44px;width:17px;height:28px;background:inherit;z-index:-1}
  .medal:before{left:10px;transform:rotate(13deg)}
  .medal:after{right:10px;transform:rotate(-13deg)}
  .locked{background:#27272a;color:#71717a;filter:grayscale(1);box-shadow:0 5px 0 #09090b}
  .m1{background:linear-gradient(135deg,#f59e0b,#fde68a);color:#7c2d12}
  .m2{background:linear-gradient(135deg,#14b8a6,#99f6e4);color:#134e4a}
  .m3{background:linear-gradient(135deg,#8b5cf6,#ddd6fe);color:#4c1d95}
  .m4{background:linear-gradient(135deg,#ef4444,#fecaca);color:#7f1d1d}
  .m5{background:linear-gradient(135deg,#0ea5e9,#bae6fd);color:#0c4a6e}
</style>
</head>
<body class="min-h-screen {{ bg_cls }} flex items-center justify-center p-4">
  <main class="relative w-full max-w-md overflow-hidden rounded-[2rem] bg-white shadow-2xl">
    <img src="{{ url_for('static', filename='euskaraz.jpeg') }}" class="absolute inset-0 m-auto h-[70%] opacity-[.045] pointer-events-none" alt="">

    <section class="relative z-10 px-6 pt-9 pb-7 text-center">
      <div class="text-sm font-black uppercase tracking-[.22em] text-zinc-400">Euskal Ageria</div>
      <h1 class="nombre {{ txt_cls }} mt-3 text-5xl sm:text-6xl">{{ alumno[0] }}</h1>

      <div class="mt-7 flex justify-center">
        <div class="relative">
          <div class="absolute inset-2 rounded-full {{ bg_cls }} scale-110"></div>
          <img src="{{ url_for('static', filename='photos/' ~ alumno[2] ~ '/' ~ alumno[1]) }}"
               alt="{{ alumno[0] }}"
               class="relative h-48 w-48 rounded-full border-8 border-white object-cover shadow-xl"
               style="animation:floaty 4s ease-in-out infinite">
        </div>
      </div>

      <div class="mt-5 inline-flex items-end gap-2 rounded-3xl bg-zinc-950 px-7 py-4 text-white shadow-lg">
        <span class="text-5xl font-black leading-none">{{ alumno[3] }}</span>
        <span class="pb-1 text-lg font-extrabold tracking-wide">PUNTU</span>
      </div>

      <div class="mt-8 rounded-3xl bg-zinc-50 p-5">
        <div class="mb-5 flex items-center justify-between">
          <div class="text-left">
            <div class="text-xs font-black uppercase tracking-[.18em] text-zinc-400">Urteko medailak</div>
            <div class="mt-1 text-sm font-bold text-zinc-600">Desblokeatu epez epe</div>
          </div>
          <div class="rounded-full bg-white px-3 py-1 text-xs font-black text-zinc-500 shadow-sm">{{ epea }}. EPEA</div>
        </div>

        <div class="flex items-start justify-between gap-2">
          {% for i in range(1,6) %}
          <div class="flex flex-col items-center gap-3">
            <div class="medal {% if i in medailak %}m{{ i }}{% else %}locked{% endif %}">
              {% if i in medailak %}{{ i }}{% else %}●{% endif %}
            </div>
            <span class="text-[11px] font-black text-zinc-500">{{ i }}. epea</span>
          </div>
          {% endfor %}
        </div>
      </div>
    </section>
  </main>
</body>
</html>
