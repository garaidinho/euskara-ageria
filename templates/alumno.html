<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8" />
<title>{{ alumno[0] }}</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root { --durFlash: .8s }

/*──────── Letra con relieve ─────*/
.nombre{
  font-family:'Luckiest Guy',cursive;line-height:.9;
  text-shadow:2px 2px 0 #fff,4px 4px 0 #000,6px 6px 0 rgb(0 0 0/.3)}
@keyframes pop   {0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateX(-50%) scale(1)}
                  50%     {transform:translateX(-50%) scale(1.15)}}
.nombre span{display:inline-block;opacity:0;animation:pop .35s forwards}
/* ancho visual para espacios dentro del nombre animado */
.nombre span.space{ width:.6em }

/*──────── Corazón ───────────────*/
.heart{position:absolute;width:230px;height:230px;transform:rotate(-45deg);opacity:.8;z-index:20}
.heart,.heart:before,.heart:after{background:inherit}
.heart:before,.heart:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%}
.heart:before{top:-115px;left:0}
.heart:after {top:0;left:115px}
@keyframes heartPop   {from{transform:rotate(-45deg) scale(0)}
                        to  {transform:rotate(-45deg) scale(1)}}
@keyframes heartPulse {0%,100%{transform:rotate(-45deg) scale(.75)}
                       50%     {transform:rotate(-45deg) scale(1)}}

/*──────── Foto ──────────────────*/
@keyframes drop {from{transform:translateY(-90px) scale(.5);opacity:0}
                 to  {transform:translateY(0)      scale(1);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/*──────── Puntos & botones ─────*/
@keyframes slideIn  {from{transform:translateY(80px);opacity:0}
                     to  {transform:translateY(0);opacity:1}}
@keyframes ptsPulse {0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/*──────── Destello Aurora ──────*/
.flash{position:fixed;inset:-10%;z-index:50;border-radius:50%;pointer-events:none;
       animation:expand var(--durFlash) ease-out forwards}
@keyframes expand{0%{transform:scale(0);opacity:.75}100%{transform:scale(12);opacity:0}}
.flash.plus  {background:radial-gradient(circle at center,#00d2ff,#25d96f)}
.flash.minus {background:radial-gradient(circle at center,#ff5858,#ffa55c)}

/* helpers hide */
@keyframes fadeOut{to{opacity:0}}
@keyframes popHide{to{transform:scale(.25);opacity:0}}
@keyframes slideOut{to{transform:translateY(80px);opacity:0}}
.fade    {animation:fadeOut .3s forwards}
.popHide {animation:popHide .25s forwards}
.btnHide {animation:slideOut .3s forwards}
</style>
</head>

<body class="flex items-center justify-center min-h-screen {{ bg_cls }}">
<div class="bg-white rounded-3xl shadow-xl p-8 pt-24 text-center max-w-sm w-full relative overflow-visible">

  <!-- Lema -->
  <img src="{{ url_for('static', filename='euskaraz.jpeg') }}"
       class="absolute inset-0 m-auto h-[85%] opacity-10 pointer-events-none" alt="">

  <!-- Nombre -->
  <h1 id="nombre"
      class="nombre whitespace-nowrap text-6xl {{ txt_cls }}
             absolute top-10 left-1/2 -translate-x-1/2 z-40 opacity-0"></h1>

  <!-- Corazón + Foto -->
  <div class="relative flex items-center justify-center z-30 mt-20 mb-4">
    <div id="heart" class="heart {{ bg_cls }}"
         style="animation:heartPop .35s ease-out forwards"></div>

    <!-- Foto (tamaño intermedio, borde del color del nombre, encima del corazón) -->
    <div class="{{ txt_cls }} relative z-30">
      <img id="foto"
           src="{{ url_for('static', filename='photos/' ~ alumno[2] ~ '/' ~ alumno[1]) }}"
           alt="{{ alumno[0] }}"
           class="w-48 h-48 rounded-full shadow-lg border-8 border-current
                  relative -top-12 opacity-0"
           style="animation:drop .5s ease-out .75s forwards">
    </div>
  </div>

  <!-- Puntos -->
  <p id="pts" class="relative z-40 text-4xl font-bold mb-4 opacity-0"
     style="animation:slideIn .4s ease-out .8s forwards">
    <span>{{ alumno[3] }}</span> PUNTU
  </p>

  <!-- +1 -->
  <form id="plusForm" method="post" class="relative z-40"
        style="animation:slideIn .4s ease-out .8s forwards">
    <button id="btnPlus" name="accion" value="1"
            class="w-full rounded-full py-3 font-bold text-white text-xl shadow-md border-4 border-black
                   bg-gradient-to-r from-cyan-400 to-emerald-400">+1 P.</button>
  </form>

  <!-- -1 -->
  <form id="minusForm" method="post" class="relative z-40 mt-2"
        style="animation:slideIn .4s ease-out .9s forwards">
    <button id="btnMinus" name="accion" value="-1"
            class="w-full rounded-full py-3 font-bold text-white text-xl shadow-md border-4 border-black
                   bg-gradient-to-r from-rose-500 to-orange-400">-1 P.</button>
  </form>
</div>

<script>
/* --- Nombre pop + rebote (conservando espacios) --- */
const n = `{{ alumno[0] }}`;
const nEl = document.getElementById('nombre');
nEl.innerHTML = [...n].map((c,i)=>{
  const delay = 0.4 + i*0.08;
  if (c === ' ') {
    return `<span class="space" style="animation-delay:${delay}s">&nbsp;</span>`;
  }
  // escapamos < y > por si acaso
  const safe = c.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return `<span style="animation-delay:${delay}s">${safe}</span>`;
}).join('');
nEl.classList.remove('opacity-0');
nEl.addEventListener('animationend',e=>{
  if(e.animationName==='pop') nEl.style.animation='bounce 1.6s ease-in-out infinite';
},{once:true});

/* --- Corazón late --- */
const heart=document.getElementById('heart');
heart.addEventListener('animationend',e=>{
  if(e.animationName==='heartPop') heart.style.animation='heartPulse 6s ease-in-out infinite';
},{once:true});

/* --- Puntos pulsan --- */
const pts=document.getElementById('pts');
pts.addEventListener('animationend',e=>{
  if(e.animationName==='slideIn') pts.style.animation+=', ptsPulse 1.6s ease-in-out infinite';
},{once:true});

/* --- Foto balancea --- */
const foto=document.getElementById('foto');
foto.addEventListener('animationend',e=>{
  if(e.animationName==='drop') foto.style.animation+=', swing 1s ease-in-out infinite alternate';
},{once:true});

/* --- Destello Aurora --- */
function flash(type){
  const d=document.createElement('div'); d.className=`flash ${type}`;
  document.body.appendChild(d);
  d.addEventListener('animationend',()=>d.remove(),{once:true});
}

/* --- Botones --- */
const btnPlus=document.getElementById('btnPlus');
const btnMinus=document.getElementById('btnMinus');
btnPlus.addEventListener('click',e=>{
  e.preventDefault(); flash('plus');
  setTimeout(()=>e.target.form.requestSubmit(btnPlus),800);
});
btnMinus.addEventListener('click',e=>{
  e.preventDefault(); flash('minus');
  setTimeout(()=>e.target.form.requestSubmit(btnMinus),800);
});
</script>
</body>
</html>
